name: PR12 SignedSignal probe

# Challenge build on hosted runners; full builds use the external runner pool.
# The original-submission provenance comparison is available by manual dispatch.

on:
  push:
    branches: [ci/pr12-signed-signal-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    name: Check PR12 SignedSignal explicitly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: "2"
      LAKE_ARTIFACT_CACHE: "false"
      LEAN_ABORT_ON_PANIC: "1"   # as Comparator sets it for builds and exports
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4   # Mathlib's current cache server
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's official build cache
        run: lake exe mathlib/cache get
      - name: Fetch immutable PR12 file as data
        run: |
          mkdir -p verification
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/leanprover-community/riemann-hypothesis/470147f4e139604173834f2329b16be081ba2139/verification/SignedSignal.lean --output verification/SignedSignal.lean
          printf '%s  %s\n' a6c945f25e6483861b77b965666a79f76af544c152122908e8078e6958272e55 verification/SignedSignal.lean | sha256sum --check
      - name: Build SignedSignal project imports without the RH cache
        run: lake build Formalism.SizeWindowBrackets.ChainSlopeWindows.LipschitzWeightAndMinimum
      - name: Check SignedSignal with stock project options
        run: |
          set -o pipefail
          lake env lean --tstack=400000 -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxSynthPendingDepth=3 -DmaxHeartbeats=4000000 verification/SignedSignal.lean | tee signed-signal-check.log
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-signal-check
          path: signed-signal-check.log
          if-no-files-found: ignore
          retention-days: 7
